<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>HR++</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="assets/icon/icon-192.png" />

  <!-- add to homescreen for ios -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <!-- barre di sistema dell'app installata: colore del tema (lo script qui sotto, poi ThemeService) -->
  <meta name="theme-color" content="#212121" />

  <!-- sfondo del caricamento con il colore del tema, prima che parta l'app: la scelta salvata da ThemeService
       ('nvx-theme' nel browser) o, senza scelta, il tema del sistema. Vale finche' Ionic non mette la classe md/ios su html -->
  <style>
    html:not(.md):not(.ios),
    html:not(.md):not(.ios) body { background: var(--nvx-avvio, #212121); }
  </style>
  <script>
    (function () {
      var scuro;
      try {
        var t = localStorage.getItem('nvx-theme');
        scuro = t === 'dark' || t === 'light' ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      } catch (e) {
        scuro = true;
      }
      var colore = scuro ? '#212121' : '#ffffff';
      document.documentElement.style.setProperty('--nvx-avvio', colore);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', colore);
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
