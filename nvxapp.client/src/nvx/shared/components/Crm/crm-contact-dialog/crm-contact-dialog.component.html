<app-page-toolbar [title]="Title" [showFilter]="false" [showBreadcrumbs]="false"></app-page-toolbar>
<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <form [formGroup]="_editForm">
        <ion-grid class="ion-no-padding">
          <ion-row>
            <ion-col size="12" size-md="6"><ion-item><ion-input formControlName="cognome" maxlength="100" [label]="'crm.contact.cognome' | transloco" labelPlacement="floating"></ion-input></ion-item></ion-col>
            <ion-col size="12" size-md="6"><ion-item><ion-input formControlName="nome" maxlength="100" [label]="'crm.contact.nome' | transloco" labelPlacement="floating"></ion-input></ion-item></ion-col>
          </ion-row>
        </ion-grid>
        @if (!valido() && _editForm.get('cognome')?.touched) {
          <ion-note color="danger">{{ 'crm.contact.nameRequired' | transloco }}</ion-note>
        }
        <ion-item><ion-input formControlName="ruolo" maxlength="100" [label]="'crm.contact.ruolo' | transloco" labelPlacement="floating"></ion-input></ion-item>
        <ion-grid class="ion-no-padding">
          <ion-row>
            <ion-col size="12" size-md="6"><ion-item><ion-input type="tel" formControlName="telefono" maxlength="30" [label]="'crm.contact.telefono' | transloco" labelPlacement="floating"></ion-input></ion-item></ion-col>
            <ion-col size="12" size-md="6"><ion-item><ion-input type="tel" formControlName="cellulare" maxlength="30" [label]="'crm.contact.cellulare' | transloco" labelPlacement="floating"></ion-input></ion-item></ion-col>
          </ion-row>
        </ion-grid>
        <ion-item><ion-input type="email" formControlName="email" maxlength="100" [label]="'crm.contact.email' | transloco" labelPlacement="floating"></ion-input></ion-item>
        @if (_editForm.get('email')?.hasError('email') && _editForm.get('email')?.touched) {
          <ion-note color="danger">{{ 'common.validation.emailInvalid' | transloco }}</ion-note>
        }
        <ion-item><ion-checkbox formControlName="principale" labelPlacement="end" justify="start">{{ 'crm.contact.principale' | transloco }}</ion-checkbox></ion-item>
        <ion-item><ion-textarea formControlName="note" rows="3" maxlength="500" [autoGrow]="true" [label]="'crm.contact.note' | transloco" labelPlacement="floating"></ion-textarea></ion-item>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
