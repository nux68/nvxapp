
<ion-header [translucent]="true">
  <ion-toolbar [color]="headerColor">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>

  <ion-toolbar *ngIf="showFilter || (showBreadcrumbs && userNavigationService.userCronology.length>1) || (showActiveJobs && ((activeJobs$ | async)?.length ?? 0) > 0)">



    <app-breadcrumbs-impersonate *ngIf="showBreadcrumbs" class="ion-hide-sm-down">

    </app-breadcrumbs-impersonate>

    <!-- Active Jobs List -->
    <div class="active-jobs-container" *ngIf="showActiveJobs && (activeJobs$ | async) as jobs">
      <ion-grid *ngIf="jobs.length > 0" class="ion-no-padding">
        <ion-row>
          <!-- Loop su ogni colonna -->
          <ion-col *ngFor="let job of jobs" size="12" size-md="3">

            <!-- In progress: hourglass + progress bar -->
            <ion-item *ngIf="!job.isFinished" lines="none" class="job-item">
              <ion-icon name="hourglass-outline" slot="start" class="ion-margin-end"></ion-icon>
              <ion-label>
                <p class="job-message">{{ job.message?.text }}</p>
                <ion-progress-bar [value]="job.progressPercentage / 100"></ion-progress-bar>
              </ion-label>
            </ion-item>

            <!-- FileGeneration finished: dismiss + download button -->
            <ion-item *ngIf="job.category === LongJobCategory.FileGeneration && job.isFinished" lines="none" class="job-item">
              <ion-button size="small" fill="clear" (click)="dismissJob(job.jobId)" color="danger" slot="start">
                <ion-icon name="close-circle-outline"></ion-icon>
              </ion-button>
              <ion-button size="small" fill="outline" shape="round" (click)="onJobLabelClick(job)" color="success">
                &nbsp;{{ job.message?.text }}
              </ion-button>
            </ion-item>

            <!-- Calculation finished: auto-removed, but show briefly -->
            <ion-item *ngIf="job.category === LongJobCategory.Calculation && job.isFinished" lines="none" class="job-item">
              <ion-icon name="checkmark-circle-outline" slot="start" class="ion-margin-end" color="success"></ion-icon>
              <ion-label>
                <p class="job-message">{{ job.message?.text }}</p>
              </ion-label>
            </ion-item>

          </ion-col>
        </ion-row>
      </ion-grid>
    </div>
    <!-- End of Active Jobs List -->


    <ion-searchbar *ngIf="showFilter"
                   (ionInput)="filter($event)"
                   placeholder="Search">
    </ion-searchbar>

  </ion-toolbar>

</ion-header>
