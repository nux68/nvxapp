
<ng-container>
  <ion-modal class="nvx-modal" [isOpen]="isModalOpen" [canDismiss]="canClose">
    <ng-template>

      <ion-header>
        <ion-toolbar>
          <ion-title>{{ 'components.parameterLoader.title' | transloco }}</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="ion-padding">
        <p>{{ 'components.parameterLoader.message' | transloco }}</p>
        <ion-progress-bar [value]="progress / 100"></ion-progress-bar>
        <p>{{ progress }}%</p>
      </ion-content>
    </ng-template>
  </ion-modal>
</ng-container>
