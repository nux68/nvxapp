
<ng-container>
  <!-- caricamento dei parametri dopo il login: icona, testi e barra al centro (a tutto schermo sul telefono) -->
  <ion-modal class="nvx-modal nvx-loader-modal" [isOpen]="isModalOpen" [canDismiss]="canClose">
    <ng-template>
      <ion-content>
        <div class="nvx-loader" role="status" aria-live="polite">
          <div class="nvx-loader-icon" aria-hidden="true">
            <ion-icon name="calendar-clear-outline"></ion-icon>
          </div>
          <h1>{{ 'components.parameterLoader.title' | transloco }}</h1>
          <p class="nvx-loader-message">{{ 'components.parameterLoader.message' | transloco }}</p>
          <div class="nvx-loader-bar">
            <ion-progress-bar [value]="progress / 100"></ion-progress-bar>
          </div>
          <p class="nvx-loader-percent">{{ progress }}%</p>
          <p class="nvx-loader-hint">{{ 'components.parameterLoader.hint' | transloco }}</p>
        </div>
      </ion-content>
    </ng-template>
  </ion-modal>
</ng-container>
