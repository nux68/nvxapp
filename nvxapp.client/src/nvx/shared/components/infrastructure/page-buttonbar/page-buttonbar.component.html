<ion-footer>
  <ion-toolbar color="light">
    <ion-buttons class="center-buttons">

      @for (item of buttonbar; track item) {
        <ion-button size="default" shape="round" (click)="item.event({})" color="{{item.color}}" [disabled]="item.disabled" fill="clear">
          <ion-icon name="{{item.image}}"></ion-icon>
          &nbsp;{{item.text}}&nbsp;&nbsp;
        </ion-button>
      }

    </ion-buttons>
  </ion-toolbar>
</ion-footer>
