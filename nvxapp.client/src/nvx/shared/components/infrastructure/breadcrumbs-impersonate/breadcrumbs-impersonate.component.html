
@if (this.userNavigationService.userCronology.length>1) {
  <ion-toolbar>
    <ion-breadcrumbs >
      @for (p of userNavigationService.userCronology; track p) {
        <ion-breadcrumb
          href="javascript:void(0)" (click)="navigateTo(p.userData.id)">{{p.userData.userName}}
        </ion-breadcrumb>
      }
    </ion-breadcrumbs>
  </ion-toolbar>
}
