<ion-header>
  <ion-toolbar>
    <ion-title>{{ title }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="login-content-center">
    <ion-card>
      <ion-card-content>

        <ion-segment [value]="tipo" (ionChange)="cambiaTipo($event.detail.value)">
          <ion-segment-button value="settimana"><ion-label>{{ 'attendance.components.seletionPeriodoDialog.week' | transloco }}</ion-label></ion-segment-button>
          <ion-segment-button value="mese"><ion-label>{{ 'attendance.components.seletionPeriodoDialog.month' | transloco }}</ion-label></ion-segment-button>
        </ion-segment>

        <ion-list>
          <ion-radio-group [value]="scelta" (ionChange)="scelta = $event.detail.value">
            @for (o of opzioni; track o.valore) {
              <ion-item>
                <ion-radio [value]="o.valore" justify="start" labelPlacement="end">{{ o.testo }}</ion-radio>
              </ion-item>
            }
          </ion-radio-group>
        </ion-list>

      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
