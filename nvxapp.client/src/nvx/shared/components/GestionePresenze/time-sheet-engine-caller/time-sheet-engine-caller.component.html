<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{Title}}</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">

  <form [formGroup]="_editForm">

    <ion-segment (ionChange)="segmentChanged($event)" [value]="currSection">
      <ion-segment-button value="sez1" content-id="sez1">
        <ion-label>Tipo calcolo</ion-label>
      </ion-segment-button>
      <ion-segment-button value="sez2" content-id="sez2">
        <ion-label>Selezione</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div [hidden]="currSection!='sez1'">

      <ion-card>
        <ion-card-content>

          <ion-row>
            <ion-col>
              <ion-item>
                <ion-label position="floating">Dal</ion-label>
                <ion-datetime-button class="datetime-button-with-label" datetime="dalle-limite-sx-modal"></ion-datetime-button>
                <ion-modal [keepContentsMounted]="true">
                  <ng-template>
                    <ion-datetime id="dalle-limite-sx-modal"
                                  formControlName="dal"
                                  presentation="date"
                                  [showDefaultButtons]="true"
                                  doneText="OK"
                                  cancelText="Annulla">
                    </ion-datetime>
                  </ng-template>
                </ion-modal>
              </ion-item>
            </ion-col>
            <ion-col>
              <ion-item>
                <ion-label position="floating">Al</ion-label>
                <ion-datetime-button class="datetime-button-with-label" datetime="alle-limite-sx-modal"></ion-datetime-button>
                <ion-modal [keepContentsMounted]="true">
                  <ng-template>
                    <ion-datetime id="alle-limite-sx-modal"
                                  formControlName="al"
                                  presentation="date"
                                  [showDefaultButtons]="true"
                                  doneText="OK"
                                  cancelText="Annulla">
                    </ion-datetime>
                  </ng-template>
                </ion-modal>
              </ion-item>
            </ion-col>
          </ion-row>


          <!--<ion-item>
            <ion-toggle formControlName="approva_Richieste_Timbrature">Approva Richieste Timbrature</ion-toggle>
          </ion-item>
          <ion-item>
            <ion-toggle formControlName="approva_Richieste_Giustificativo">Approva Richieste Giustificativo</ion-toggle>
          </ion-item>
          <ion-item>
            <ion-toggle formControlName="genera_Timbrature_Mancanti">Genera Timbrature Mancanti</ion-toggle>
          </ion-item>-->

        </ion-card-content>
      </ion-card>


    </div>

    <div [hidden]="currSection!='sez2'">

      <app-sedi-reparto-user-selection [showPeriodSelect]="false"
                                       [showSediSelect]="false"
                                       [showRepartoSelect]="true"
                                       [showUserSelect]="true"
                                       [singleSelectUser]="false"
                                       [initialSelectedUserId]="timeSheetEngineCallerData.initialSelectedUserId"
                                       (periodChange)="onPeriodChange($event)"
                                       (sediIdChange)="onSedeChanged($event)"
                                       (repartoIdChange)="onRepartiChanged($event)"
                                       (allUsersIdChange)="onAllUsersInSelectionChanged($event)"
                                       (currUserIdChange)="onCurrentUserChanged($event)">
      </app-sedi-reparto-user-selection>

    </div>


  </form>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
