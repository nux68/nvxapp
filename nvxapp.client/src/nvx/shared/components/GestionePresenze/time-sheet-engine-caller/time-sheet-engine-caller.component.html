<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{Title}}</ion-title>
  </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true">

  <form [formGroup]="_editForm">

    <ion-segment (ionChange)="segmentChanged($event)" [value]="currSection">
      <ion-segment-button value="sez1" content-id="sez1">
        <ion-label>Tipo calcolo</ion-label>
      </ion-segment-button>
      <ion-segment-button value="sez2" content-id="sez2">
        <ion-label>Selezione</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div [hidden]="currSection!='sez1'">

      <ion-item>
        <ion-label position="floating">Codice</ion-label>
        <ion-input type="text" formControlName="codice"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="_editForm.get('codice')?.hasError('required') && _editForm.get('codice')?.touched">
        codice è obbligatorio.
      </ion-note>
      <ion-note color="danger" *ngIf="_editForm.get('codice')?.hasError('maxlength') && _editForm.get('codice')?.touched">
        codice non può superare i 5 caratteri.
      </ion-note>


    </div>

    <div [hidden]="currSection!='sez2'">

      <app-sedi-reparto-user-selection [showPeriodSelect]="false"
                                       [showSediSelect]="false"
                                       [showRepartoSelect]="true"
                                       [showUserSelect]="true"
                                       [singleSelectUser]="false"

                                       [initialSelectedUserId] ="timeSheetEngineCallerData.initialSelectedUserId" 

                                       (periodChange)="onPeriodChange($event)"
                                       (sediIdChange)="onSedeChanged($event)"
                                       (repartoIdChange)="onRepartiChanged($event)"
                                       (allUsersIdChange)="onAllUsersInSelectionChanged($event)"
                                       (currUserIdChange)="onCurrentUserChanged($event)">
      </app-sedi-reparto-user-selection>

    </div>


  </form>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
