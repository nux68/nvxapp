<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{Title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="_par_CausaliList!=null">

  <form [formGroup]="_editForm">

    <ion-card>
      <ion-card-content>

        <ion-item>
          <ion-label position="floating">Codice</ion-label>
          <ion-input type="text" formControlName="codice"></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="_editForm.get('codice')?.hasError('required') && _editForm.get('codice')?.touched">
          codice è obbligatorio.
        </ion-note>
        <ion-note color="danger" *ngIf="_editForm.get('codice')?.hasError('maxlength') && _editForm.get('codice')?.touched">
          codice non può superare i 5 caratteri.
        </ion-note>



        <ion-item>
          <ion-label position="floating">Causale</ion-label>
          <ion-select formControlName="idCausale" placeholder="Seleziona la causale">
            <ion-select-option *ngFor="let causale of _par_CausaliList" [value]="causale.id">
              {{ causale.descrizione }}
            </ion-select-option>
          </ion-select>
        </ion-item>
        <ion-note color="danger" *ngIf="_editForm.get('_editForm.idCausale')?.hasError('required') && _editForm.get('_editForm.idCausale')?.touched">
          La causale è obbligatoria.
        </ion-note>


      </ion-card-content>
    </ion-card>

  </form>

</ion-content>


<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
