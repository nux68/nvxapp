<ion-header>
  <ion-toolbar>
    <ion-title>Seleziona Competenze</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="login-content-center">
    <ion-card>
      <ion-card-content>

        <ion-grid>
          <ion-row>
            <ion-col size="1"></ion-col>
            <ion-col>Descrizione</ion-col>

          </ion-row>
          @for (item of getPar_Competenza() | genericFilter: 'descrizione' : searchText; track item.id) {
            <ion-row class="nvx-ion-row-4table">
              <ion-col size="1">
                <ion-checkbox [checked]="Par_Competenza_IsSelected(item.id)" (ionChange)="Par_Competenza_Toggle(item.id, $event)"></ion-checkbox>
              </ion-col>
              <ion-col>
                <ion-label>
                  {{ item.id | parCompetenzaToLongText }}
                </ion-label>
              </ion-col>
            </ion-row>
          } @empty {
            <ion-row>
              <ion-col>
                <ion-note>Tutte le competenze sono già assegnate.</ion-note>
              </ion-col>
            </ion-row>
          }
        </ion-grid>


      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
