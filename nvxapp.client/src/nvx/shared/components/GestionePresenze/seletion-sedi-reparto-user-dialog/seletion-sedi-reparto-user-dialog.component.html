<ion-header>
  <ion-toolbar>
    <ion-title>Seleziona</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="login-content-center">
    <ion-card>
      <ion-card-content>

        @if (filterIdAspNetUsers) {
          <ion-note>Sono proposti solo i dipendenti con almeno una delle competenze richieste dalle attività della sub commessa.</ion-note>
        }

        <br />

        <app-sedi-reparto-user-navigation [showPeriodSelect]="false"
                                          [filterIdAspNetUsers]="filterIdAspNetUsers"
                                          [showSediSelect]="true"
                                          [showRepartoSelect]="true"
                                          [showUserSelect]="true"

                                          [singleFieldOnRow]="true"
                                          [singleSelectReparti]="true"
                                          [singleSelectUser]="false"

                                          (periodChange)="onPeriodChange($event)"
                                          (sediIdChange)="onSedeChanged($event)"
                                          (repartoIdChange)="onRepartiChanged($event)"
                                          (allUsersIdChange)="onAllUsersInSelectionChanged($event)"
                                          (currUserIdChange)="onCurrentUserChanged($event)">
        </app-sedi-reparto-user-navigation>


      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
