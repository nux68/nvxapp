<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{Title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <form [formGroup]="_editForm">

    <ion-card>
      <ion-card-content>



        <ion-item>
          <ion-label position="stacked">Profilo orario</ion-label>
          <ion-select formControlName="idPar_ProfiloOrario"
                      placeholder="Seleziona un profilo orario"
                      interface="modal">
            <ion-select-option [value]="profilo.id" *ngFor="let profilo of sharedParameterGestionePresenzeService.Par_ProfiloOrario">
              {{ profilo.id | parProfiloOrarioToLongTextPipe }}
            </ion-select-option>
          </ion-select>
        </ion-item>


        <ion-item>
          <ion-label position="floating">Num. Giorno partenza ciclo ( {{_editForm.get('numGiornoPartenzaCiclo')?.value}} / {{getDayProf()}} )</ion-label>
          <!--<ion-input type="number" formControlName="numGiornoPartenzaCiclo"></ion-input>-->
          <ion-range aria-label="Range with ticks" formControlName="numGiornoPartenzaCiclo" [ticks]="true" [snaps]="true" [min]="1" [max]="getDayProf()"></ion-range>
        </ion-item>


      </ion-card-content>
    </ion-card>

  </form>


</ion-content>


<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
