<ion-header>
  <ion-toolbar color="primary">
    <ion-title>{{Title}}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">

  <form [formGroup]="_editForm">

    <ion-card>
      <ion-card-content>



        <ion-item>
          <ion-label position="stacked">Profilo orario</ion-label>
          <ion-select formControlName="idPar_ProfiloOrario"
                      placeholder="Seleziona un profilo orario"
                      interface="modal" (ionChange)="onProfiloOrarioChange($event)">
            <ion-select-option [value]="profilo.id" *ngFor="let profilo of sharedParameterGestionePresenzeService.Par_ProfiloOrario">
              {{ profilo.id | parProfiloOrarioToLongTextPipe }}
            </ion-select-option>
          </ion-select>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Dal</ion-label>
          <ion-datetime-button class="datetime-button-with-label" datetime="dalle-limite-sx-modal"></ion-datetime-button>
          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime id="dalle-limite-sx-modal"
                            formControlName="dal"
                            presentation="date"
                            [firstDayOfWeek]="1"
                            [showDefaultButtons]="true"
                            doneText="OK"
                            cancelText="Annulla" (ionChange)="updateDateTimeDalle($event)">
              </ion-datetime>
            </ng-template>
          </ion-modal>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Al</ion-label>
          <ion-datetime-button class="datetime-button-with-label" datetime="alle-limite-sx-modal"></ion-datetime-button>
          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime id="alle-limite-sx-modal"
                            formControlName="al"
                            presentation="date"
                            [firstDayOfWeek]="1"
                            [showDefaultButtons]="true"
                            doneText="OK"
                            cancelText="Annulla">
              </ion-datetime>
            </ng-template>
          </ion-modal>
        </ion-item>


        <ng-container *ngIf="curr_Par_ProfiloOrario != null && curr_Par_ProfiloOrario.tipoProfilo!=0">
          <ion-item>
            <ion-label position="floating">Num. Giorno partenza ciclo ( {{_editForm.get('numGiornoPartenzaCiclo')?.value}} / {{getDayProf()}} )</ion-label>
            <ion-range aria-label="Range with ticks" formControlName="numGiornoPartenzaCiclo" [ticks]="true" [snaps]="true" [min]="1" [max]="getDayProf()"></ion-range>
          </ion-item>
        </ng-container>
        


      </ion-card-content>
    </ion-card>

  </form>


</ion-content>


<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
