<app-page-toolbar [title]="Title" [showFilter]="ShowFilter" [showBreadcrumbs]="true"></app-page-toolbar>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <form [formGroup]="_editForm">
        <ion-item class="nvx-item-4-title"><ion-label>{{ 'hr.pages.settings.general' | transloco }}</ion-label></ion-item>
        <ion-item><ion-input type="number" formControlName="giorniPreavviso" [label]="'hr.pages.settings.noticeDays' | transloco" labelPlacement="floating"></ion-input></ion-item>
        <ion-note class="nvx-nota-disabled">{{ 'hr.pages.settings.noticeDaysNote' | transloco }}</ion-note>
        <ion-item><ion-toggle formControlName="notificheAttive">{{ 'hr.pages.settings.notifications' | transloco }}</ion-toggle></ion-item>
        <ion-note class="nvx-nota-disabled">{{ 'hr.pages.settings.notificationsNote' | transloco }}</ion-note>
        <ion-item><ion-textarea formControlName="note" rows="4" maxlength="2000" [autoGrow]="true" [label]="'hr.pages.settings.note' | transloco" labelPlacement="floating"></ion-textarea></ion-item>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
