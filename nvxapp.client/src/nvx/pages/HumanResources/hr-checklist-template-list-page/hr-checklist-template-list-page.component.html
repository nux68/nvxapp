<app-page-toolbar [title]="title" [showFilter]="true" [showBreadcrumbs]="true" (ev_Filter)="Filter($event)"></app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <ion-note class="nvx-nota-disabled">{{ 'hr.pages.templateList.note' | transloco }}</ion-note>
      <nvx-list-options [showDisabledLabel]="'hr.common.showDisabled' | transloco" [(showDisabled)]="showDisabled"></nvx-list-options>
      <nvx-list [items]="items" [columns]="columns" [actions]="actions" icon="list-outline" [searchText]="searchText"
        [rowDisabled]="isDisabled" [disabledToggleExternal]="true" [(showDisabled)]="showDisabled"></nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
