<app-page-toolbar [title]="title" [showFilter]="true" [showBreadcrumbs]="true" (ev_Filter)="Filter($event)"></app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      @if (studio) {
        <ion-item>
          <ion-select [(ngModel)]="idCompany" (ionChange)="load()" [label]="'hr.fields.azienda' | transloco" labelPlacement="floating" interface="popover">
            @for (a of aziende; track a.idCompany) {
              <ion-select-option [value]="a.idCompany">{{ a.descrizione }}</ion-select-option>
            }
          </ion-select>
        </ion-item>
        @if (aziende.length === 0) {
          <ion-note class="nvx-nota-disabled">{{ 'hr.pages.payslipList.noCompanies' | transloco }}</ion-note>
        }
      }
      <ion-note class="nvx-nota-disabled">{{ 'hr.pages.payslipList.note' | transloco }}</ion-note>
      <nvx-list [items]="items" [columns]="columns" [actions]="actions" icon="documents-outline" [searchText]="searchText" [highlight]="evidenzia"></nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
