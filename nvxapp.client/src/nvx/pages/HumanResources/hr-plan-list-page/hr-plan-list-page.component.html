<app-page-toolbar [title]="title" [showFilter]="true" [showBreadcrumbs]="true" (ev_Filter)="Filter($event)"></app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <ion-note class="nvx-nota-disabled">{{ 'hr.pages.planList.note' | transloco }}</ion-note>
      <nvx-list [items]="items" [columns]="columns" [actions]="actions" icon="clipboard-outline" [searchText]="searchText"></nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
