<app-page-toolbar [title]="title" [showFilter]="true" [showBreadcrumbs]="true" (ev_Filter)="Filter($event)"></app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <ion-note class="nvx-nota-disabled">{{ 'hr.pages.checklistList.note' | transloco }}</ion-note>
      <ion-item lines="none"><ion-toggle [(ngModel)]="soloAperte" (ionChange)="load()">{{ 'hr.pages.checklistList.onlyOpen' | transloco }}</ion-toggle></ion-item>
      <nvx-list [items]="items" [columns]="columns" [actions]="actions" icon="checkbox-outline" [searchText]="searchText" [highlight]="scaduta"></nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
