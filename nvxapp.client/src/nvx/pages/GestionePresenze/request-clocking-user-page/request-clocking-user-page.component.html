<app-page-toolbar [title]="title"
                  [showFilter]="false"
                  [showBreadcrumbs]="true">
</app-page-toolbar>


<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>


      <br />

      <form [formGroup]="_editForm">

        <div class="clock-container">

          <ion-datetime-button class="datetime-button-with-label" datetime="currentDate-modal"></ion-datetime-button>
          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime id="currentDate-modal"
                            formControlName="currentDate"
                            presentation="date-time"
                            [showDefaultButtons]="true"
                            doneText="OK"
                            cancelText="Annulla"
                            (ionChange)="updateDateTime($event)">
              </ion-datetime>
            </ng-template>
          </ion-modal>

        {{ att.descrizione }}

          <ion-item>
            <ion-label position="floating">Commessa Attivita</ion-label>
            <ion-select formControlName="idPar_Attivita" placeholder="Seleziona l attivita">
              <ion-select-option *ngFor="let attivita of az_SubCommessaAttivita_4FullList" [value]="attivita.subCommessaAttivita_Id">
                {{ attivita.cliente_Descrizione }} {{ attivita.commessa_Decrizione }} {{ attivita.subCommessa_Decrizione }} {{ attivita.subCommessaAttivita_Par_Attivita_Descrizione }}
              </ion-select-option>
            </ion-select>
          </ion-item>
          <ion-note color="danger" *ngIf="_editForm.get('idPar_Attivita')?.hasError('required') && _editForm.get('idPar_Attivita')?.touched">
            L attivita è obbligatoria.
          </ion-note>


        </div>

      </form>

</ion-card-content>

</ion-content>
