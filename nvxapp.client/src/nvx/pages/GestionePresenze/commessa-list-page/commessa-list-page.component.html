<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <nvx-list
        [items]="commessaList"
        [columns]="columns"
        [actions]="actions"
        icon="server-outline"
        [searchText]="searchText"
        [sort]="sortList">
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
