<!-- request-justification-user-page.component.html -->
<app-page-toolbar [title]="title"
                  [showFilter]="false"
                  [showBreadcrumbs]="true">
</app-page-toolbar>

<!-- REMOVED dark-background class -->
<ion-content [fullscreen]="true">
  <!-- Rest of the content remains the same -->

  <div class="form-section">
    <div class="form-label">Giustificativo</div>
    <div class="form-input">
      <ion-select [(ngModel)]="justificationType" interface="action-sheet" placeholder="Seleziona">
        <ion-select-option value="FERIE">FERIE</ion-select-option>
        <ion-select-option value="PERMESSO">PERMESSO</ion-select-option>
        <ion-select-option value="MALATTIA">MALATTIA</ion-select-option>
      </ion-select>
    </div>
  </div>

  <div class="form-section">
    <div class="form-label">Tipo richiesta</div>
    <div class="form-input">
      <ion-select [(ngModel)]="requestType" interface="action-sheet" placeholder="Seleziona">
        <ion-select-option value="A_DURATA">A durata</ion-select-option>
        <ion-select-option value="GIORNALIERA">Giornaliera</ion-select-option>
      </ion-select>
    </div>
  </div>

  <div class="form-section">
    <div class="form-label">Inizio</div>
    <div class="form-input date-input-container">
      <ion-datetime-button datetime="startDatetime"></ion-datetime-button>
    </div>
  </div>

  <div class="form-section">
    <div class="form-label">Fine</div>
    <div class="form-input date-input-container">
      <ion-datetime-button datetime="endDatetime"></ion-datetime-button>
    </div>
  </div>

  <div class="form-section">
    <div class="form-label">Ore</div>
    <div class="hours-input">
      <div class="hours-display">{{hoursFormatted}}</div>
      <div class="hours-controls">
        <button class="hours-button decrease" (click)="decreaseHours()" [disabled]="fullDay">
          <ion-icon name="remove"></ion-icon>
        </button>
        <button class="hours-button increase" (click)="increaseHours()" [disabled]="fullDay">
          <ion-icon name="add"></ion-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="form-section toggle-section">
    <span>Giorno intero</span>
    <ion-toggle [(ngModel)]="fullDay" (ionChange)="toggleFullDay()"></ion-toggle>
  </div>

  <div class="form-section">
    <div class="form-label">Responsabili</div>
    <div class="form-input supervisors">
      <div class="chips-container">
        <div class="chip" *ngFor="let supervisor of supervisors; let i = index">
          <span>{{ supervisor }}</span>
          <ion-icon name="trash" (click)="removeSupervisor(i)"></ion-icon>
        </div>
      </div>
      <button class="add-button" (click)="addSupervisor()">
        <ion-icon name="add"></ion-icon>
      </button>
    </div>
  </div>

  <div class="form-section notes-section">
    <div class="form-label">Note</div>
    <div class="form-input">
      <ion-textarea [(ngModel)]="notes" placeholder="Inserisci note..." rows="4"></ion-textarea>
    </div>
  </div>

  <div class="submit-button-container">
    <button class="submit-button" (click)="submitRequest()">
      <ion-icon name="save"></ion-icon>
      <span>Invia</span>
    </button>
  </div>

  <!-- Modals remain the same -->
  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="startDatetime"
                    [(ngModel)]="startDate"
                    presentation="date"
                    [showDefaultButtons]="true"
                    doneText="Fatto"
                    cancelText="Annulla"
                    locale="it-IT">
      </ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="endDatetime"
                    [(ngModel)]="endDate"
                    presentation="date"
                    [min]="startDate"
                    [showDefaultButtons]="true"
                    doneText="Fatto"
                    cancelText="Annulla"
                    locale="it-IT">
      </ion-datetime>
    </ng-template>
  </ion-modal>

</ion-content>
