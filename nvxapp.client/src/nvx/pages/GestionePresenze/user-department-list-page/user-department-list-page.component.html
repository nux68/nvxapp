<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <nvx-list
        [items]="userCompanyList"
        [columns]="columns"
        [actions]="actions"
        trackKey="idUserCompany"
        [icon]="iconOf"
        [highlight]="isHighlighted"
        [searchText]="searchText"
        [sort]="sortByRole"
        [rowDisabled]="isDisabled"
        [disabledToggleLabel]="'attendance.pages.userDepartmentList.showDisabled' | transloco">
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
