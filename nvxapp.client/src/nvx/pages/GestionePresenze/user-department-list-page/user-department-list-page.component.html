<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>
<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>



      @if (userCompanyList!=null) {
        <ion-grid>
          @for (item of getAll() | genericFilter: 'descrizione' : searchText; track item; let indexRow4Color = $index) {
            <ion-row
              [class.nvx-row-odd]="indexRow4Color % 2 !== 0"
              [class.nvx-row-even]="indexRow4Color % 2 === 0"
              class="nvx-ion-row-4table nvx-row-hover">
              <!--mobile-->
              <ion-item-sliding class="ion-hide-sm-up"
                [class.nvx-row-odd]="indexRow4Color % 2 !== 0"
                [class.nvx-row-even]="indexRow4Color % 2 === 0">
                <ion-item>
                  <ion-icon [name]="isAdmin(item) ? 'person-add-outline' : 'person-outline'"></ion-icon>
                  <ion-label [ngStyle]="{ color: isAdmin(item) ? 'var(--ion-color-primary)' : '' }">
                    {{ item.descrizione }}
                  </ion-label>
                </ion-item>
                <ion-item-options side="end">
                  @if (isUser(item)) {
                    <ion-item-option class="item-option-text-only_primary"
                      (click)="btnImpersona.event(item)"
                      >
                      <ion-icon slot="start" name="{{btnImpersona.image}}"></ion-icon>
                      Impersona
                    </ion-item-option>
                  }
                  <ion-item-option class="item-option-text-only_modifica"
                    (click)="btnEdit.event(item)">
                    <ion-icon slot="start" name="{{btnEdit.image}}"></ion-icon>
                    Modifica
                  </ion-item-option>
                </ion-item-options>
              </ion-item-sliding>
              <!--desktop-->
              <ion-col size="8" class="ion-hide-sm-down">
                <ion-icon [name]="isAdmin(item) ? 'person-add-outline' : 'person-outline'"></ion-icon>
                <ion-label [ngStyle]="{ color: isAdmin(item) ? 'var(--ion-color-primary)' : '' }">
                  {{ item.descrizione }}
                </ion-label>
              </ion-col>
              <ion-col size="2" class="ion-hide-sm-down">
                @if (isUser(item)) {
                  <ion-button size="small" fill="outline" shape="round" (click)="btnImpersona.event(item)" color="{{btnImpersona.color}}">
                    <ion-icon name="{{btnImpersona.image}}"></ion-icon>
                    &nbsp;{{btnImpersona.text}}
                  </ion-button>
                }
              </ion-col>
              <ion-col size="2" class="ion-hide-sm-down">
                <ion-button size="small" fill="outline" shape="round" (click)="btnEdit.event(item)" color="{{btnEdit.color}}">
                  <ion-icon name="{{btnEdit.image}}"></ion-icon>
                  &nbsp;{{btnEdit.text}}
                </ion-button>
              </ion-col>
            </ion-row>
          }
        </ion-grid>
      }

    </ion-card-content>
  </ion-card>

</ion-content>
