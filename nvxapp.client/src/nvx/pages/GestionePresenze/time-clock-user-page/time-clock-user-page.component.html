<app-page-toolbar [title]="Title"
                  [showFilter]="false"
                  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>

      <br />
      <br />
      <br />
      <br />

      <form [formGroup]="_editForm">

        <div class="clock-container">

          <ion-datetime-button class="datetime-button-with-label" datetime="currentDate-modal"></ion-datetime-button>
          <ion-modal [keepContentsMounted]="true">
            <ng-template>
              <ion-datetime id="currentDate-modal"
                            formControlName="currentDate"
                            presentation="date-time"
                            [showDefaultButtons]="true"
                            doneText="OK"
                            cancelText="Annulla"
                            (ionChange)="onStartDatetimeChange($event)">
              </ion-datetime>
            </ng-template>
          </ion-modal>

          <div class="clock-container">
            <div class="time">{{ currentTime }}</div>
          </div>

          <ion-item class="nvx-item-4-title">
            <ion-label>Ultima timbratura: {{ lastAction }}</ion-label>
          </ion-item>


          <ion-item>
            <ion-label position="floating">Attivita </ion-label>
            <ion-select formControlName="idPar_Attivita" placeholder="Seleziona l attivita">
              <ion-select-option *ngFor="let att of par_AttivitaList" [value]="att.id">
                {{ att.descrizione }}
              </ion-select-option>
            </ion-select>
          </ion-item>
          <ion-note color="danger" *ngIf="_editForm.get('idPar_Attivita')?.hasError('required') && _editForm.get('idPar_Attivita')?.touched">
            L attività è obbligatoria.
          </ion-note>


        </div>

      </form>

    </ion-card-content>
  </ion-card>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
