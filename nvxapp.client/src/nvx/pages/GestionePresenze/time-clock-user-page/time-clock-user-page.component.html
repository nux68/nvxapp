</app-page-toolbar>

      <br />
      <br />
      <br />

      <div class="form-section">
        <div class="form-input date-input-container">
          <ion-datetime-button datetime="startDatetime"></ion-datetime-button>
        </div>
      </div>

      <div class="clock-container">
        <!--<div class="date">{{ formattedDate }}</div>-->
        <div class="time">{{ currentTime }}</div>
      </div>

        <ion-card-content>

            Ultima timbratura: {{ lastAction }}
          </ion-label>
        </ion-card-content>
      </ion-card>-->

      <ion-item class="nvx-item-4-title">
        <ion-label>Ultima timbratura: {{ lastAction }}</ion-label>
      </ion-item>

      <!--<div class="button-container">
    <button class="clock-button clock-in-out" (click)="clockInOut()">
      <ion-icon name="time-outline"></ion-icon>
      <span>TIMBRA</span>
    </button>
  </div>-->
      <!-- Modals remain the same -->
      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="startDatetime"
                        [(ngModel)]="startDateBtn"
                        presentation="date-time"
                        [firstDayOfWeek]="1"
                        [showDefaultButtons]="true"
                        doneText="Fatto"
                        cancelText="Annulla"
                        locale="it-IT"
                        (ionChange)="onStartDatetimeChange($event)">
          </ion-datetime>
        </ng-template>
      </ion-modal>

    </ion-card-content>
  </ion-card>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
