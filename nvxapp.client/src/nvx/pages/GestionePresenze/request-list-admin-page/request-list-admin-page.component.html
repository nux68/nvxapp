<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>

      <!-- meta' a sinistra la scelta dei reparti, meta' a destra il filtro delle richieste (su mobile uno sotto l'altro) -->
      <ion-row>
        <ion-col size-xs="12" size-md="6">
          <app-sedi-reparto-user-navigation [showPeriodSelect]="false"
            [showSediSelect]="false"
            [showRepartoSelect]="true"
            [showUserSelect]="false"
            (periodChange)="onPeriodChange($event)"
            (sediIdChange)="onSedeChanged($event)"
            (repartoIdChange)="onRepartiChanged($event)"
            (allUsersIdChange)="onAllUsersInSelectionChanged($event)"
            (currUserIdChange)="onCurrentUserChanged($event)">
          </app-sedi-reparto-user-navigation>
        </ion-col>
        <ion-col size-xs="12" size-md="6">
          <div class="ion-padding nvx-filtro-richieste">
            <ion-item>
              <ion-label position="stacked">{{ 'attendance.pages.requestListAdmin.filtro' | transloco }}</ion-label>
              <ion-select [(ngModel)]="filtro" (ionChange)="onFiltroChange()" interface="popover">
                @for (f of filtri; track f.value) {
                  <ion-select-option [value]="f.value">{{ f.key | transloco }}</ion-select-option>
                }
              </ion-select>
            </ion-item>
          </div>
        </ion-col>
      </ion-row>

      <nvx-list
        [items]="richiesteFiltrate"
        [columns]="columns"
        [actions]="actions"
        [searchText]="searchText">
        <!-- mobile: dipendente, poi date e stato, poi tipo e dettaglio -->
        <ng-template nvxMobile let-item>
          <ion-label>
            <h2><strong>{{ cognome(item) }} {{ nome(item) }}</strong></h2>
            <p>{{ getItemText1(item) }}</p>
            <p>{{ getItemText2(item) }}</p>
          </ion-label>
        </ng-template>
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
