<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <nvx-list
        [items]="par_CausaliList"
        [columns]="columns"
        [actions]="actions"
        icon="server-outline"
        [searchText]="searchText"
        [sort]="sortList">
        <ng-template nvxCell="tipo" let-item>{{ (item.tipo === 1 ? 'attendance.common.tipoValoreImporto' : 'attendance.common.tipoValoreOrario') | transloco }}</ng-template>
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
