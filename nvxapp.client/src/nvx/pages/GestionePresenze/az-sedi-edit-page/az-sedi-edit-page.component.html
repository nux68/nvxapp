<app-page-toolbar [title]="Title"
                  [showFilter]="ShowFilter"
                  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <form [formGroup]="_editForm">

        <ion-segment (ionChange)="segmentChanged($event)" [value]="currSection">
          <ion-segment-button value="sez1" content-id="sez1">
            <ion-label>Generale</ion-label>
          </ion-segment-button>
          <ion-segment-button value="sez2" content-id="sez2">
            <ion-label>Attività</ion-label>
          </ion-segment-button>
        </ion-segment>

        <div [hidden]="currSection!='sez1'">
          <br />
          <div formGroupName="az_Sedi">

            <ion-item class="nvx-item-4-title">
              <ion-label>Info sede</ion-label>
            </ion-item>

            <ion-item>
              <ion-label position="floating">Descrizione</ion-label>
              <ion-input type="text" formControlName="descrizione"></ion-input>
            </ion-item>
            <ion-note color="danger" *ngIf="_editForm.get('descrizione')?.hasError('required') && _editForm.get('descrizione')?.touched">
              La descrizione è obbligatoria.
            </ion-note>
            <ion-note color="danger" *ngIf="_editForm.get('descrizione')?.hasError('maxlength') && _editForm.get('descrizione')?.touched">
              La descrizione non può superare i 50 caratteri.
            </ion-note>
          </div>
        </div>

        <div [hidden]="currSection!='sez2'">
          <br />

          <ion-item class="nvx-item-4-title">
            <ion-label>Attività sede</ion-label>
          </ion-item>


          <ion-item-sliding *ngFor="let item of getPar_Attivita() | genericFilter: 'descrizione' : searchText" class="ion-hide-sm-up">
            <ion-item>
              <ion-checkbox slot="start" [checked]="isSelectedaz_Az_SediRepartoAttivita(item.id)" (ionChange)="toggleSelectionaz_Az_SediRepartoAttivita(item.id, $event)"></ion-checkbox>
              <ion-label>
                {{ item.id | parAttivitaToLongText }}
              </ion-label>
            </ion-item>
          </ion-item-sliding>

          <ion-grid class="ion-hide-sm-down">
            <ion-row>
              <ion-col size="1">Abil</ion-col>
              <ion-col>Descr</ion-col>

            </ion-row>
            <ion-row *ngFor="let item of getPar_Attivita() | genericFilter: 'descrizione' : searchText" class="nvx-ion-row-4table">
              <ion-col size="1">
                <ion-checkbox [checked]="isSelectedaz_Az_SediRepartoAttivita(item.id)" (ionChange)="toggleSelectionaz_Az_SediRepartoAttivita(item.id, $event)"></ion-checkbox>
              </ion-col>
              <ion-col>
                <ion-label>
                  {{ item.id | parAttivitaToLongText }}
                </ion-label>
              </ion-col>
            </ion-row>
          </ion-grid>


        </div>



      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
