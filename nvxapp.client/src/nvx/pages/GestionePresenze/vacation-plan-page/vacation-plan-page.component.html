<app-page-toolbar [title]="Title"
                  [showFilter]="false"
                  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>

      <app-sedi-reparto-user-selection [showPeriodSelect]="true"
                                       [showSediSelect]="false"
                                       [showRepartoSelect]="true"
                                       [showUserSelect]="true"
                                       [singleSelectUser]="false"
                                       (periodChange)="onPeriodChange($event)"
                                       (sediIdChange)="onSedeChanged($event)"
                                       (repartoIdChange)="onRepartiChanged($event)"
                                       (allUsersIdChange)="onAllUsersInSelectionChanged($event)"
                                       (currUserIdChange)="onCurrentUserChanged($event)">
      </app-sedi-reparto-user-selection>

      <form [formGroup]="_editForm"></form>

      <!-- GRIGLIA PIANO FERIE -->
      <ion-grid *ngIf="daySlots?.length > 0 && getDaysInMonth().length > 0" class="vg-grid">

        <!-- INTESTAZIONE -->
        <ion-row class="vg-header-row">

          <ion-col size="2" class="vg-name-col vg-header-cell">
            Dipendente
          </ion-col>

          <ion-col size="10" class="vg-days-col">
            <div class="vg-days-scroll">
              <div *ngFor="let day of getDaysInMonth()"
                   class="vg-day-header"
                   [class.vg-weekend]="isWeekend(day)">
                <span class="vg-day-num">{{ day }}</span>
                <span class="vg-day-label">{{ getDayLabel(day) }}</span>
              </div>
            </div>
          </ion-col>

        </ion-row>

        <!-- RIGHE DIPENDENTI -->
        <ion-row *ngFor="let slot of getAll(); let i = index"
                 [class.nvx-row-odd]="i % 2 !== 0"
                 [class.nvx-row-even]="i % 2 === 0"
                 class="nvx-ion-row-4table nvx-row-hover vg-data-row">

          <!-- COGNOME + NOME -->
          <ion-col size="2" class="vg-name-col">
            <ion-label>
              <strong>{{ slot.idAspNetUsers | idAspNetUsersToCognome }}</strong>
              {{ slot.idAspNetUsers | idAspNetUsersToNome }}
            </ion-label>
          </ion-col>

          <!-- GIORNI DEL MESE -->
          <ion-col size="10" class="vg-days-col">
            <div class="vg-days-scroll">

              <div *ngFor="let day of getDaysInMonth()"
                   class="vg-day-cell"
                   [class.vg-weekend]="isWeekend(day)">

                <ng-container *ngIf="getGiustificativiForDay(slot, day) as giust">

                  <ng-container *ngIf="giust.length > 0; else emptyDay">
                    <div class="vg-chips-stack">
                      <ion-chip *ngFor="let g of giust"
                                [ngStyle]="{
                                  'background': timeSheetService.get_Dip_GG_Giustificativi_backColor(g),
                                  'color':      timeSheetService.get_Dip_GG_Giustificativi_txtColor(g),
                                  'font-size':  '0.75em',
                                  'margin':     '1px 0px',
                                  'height':     '18px',
                                  'cursor':     'default'
                                }"
                                [title]="g.idPar_Giustificativi | parGiustificativiToLongText">
                        {{ g.idPar_Giustificativi | parGiustificativiToShortText }}
                      </ion-chip>
                    </div>
                  </ng-container>

                  <ng-template #emptyDay>
                    <span class="vg-empty">-</span>
                  </ng-template>

                </ng-container>

              </div>

            </div>
          </ion-col>

        </ion-row>

      </ion-grid>
      


    </ion-card-content>
  </ion-card>

</ion-content>
