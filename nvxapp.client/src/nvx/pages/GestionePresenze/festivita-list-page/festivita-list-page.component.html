<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>

      @if (par_FestivitaList) {
        <ion-grid>
          @for (item of getAll() | genericFilter: 'descrizione' : searchText; track item.id; let indexRow4Color = $index) {
            <ion-row
              [class.nvx-row-odd]="indexRow4Color % 2 !== 0"
              [class.nvx-row-even]="indexRow4Color % 2 === 0"
              class="nvx-ion-row-4table nvx-row-hover">
              <ion-item-sliding class="ion-hide-sm-up"
                [class.nvx-row-odd]="indexRow4Color % 2 !== 0"
                [class.nvx-row-even]="indexRow4Color % 2 === 0">
                <ion-item>
                  <ion-grid>
                    <ion-row class="ion-align-items-center">
                      <ion-col size="2">
                        <ion-icon name="calendar-outline"></ion-icon>
                      </ion-col>
                      <ion-col size="5">
                        <div class="descrizione">{{ item.descrizione }}</div>
                      </ion-col>
                      <ion-col size="5">
                        <div class="descrizione">{{ quando(item) }}</div>
                      </ion-col>
                    </ion-row>
                  </ion-grid>
                </ion-item>
                <app-slide-button-cancella-modifica [item]="item"
                  [btnDelete]="btnDelete"
                  [btnEdit]="btnEdit"
                  [showDelete]="true">
                </app-slide-button-cancella-modifica>
              </ion-item-sliding>
              <ion-col size="5" class="ion-hide-sm-down">
                <ion-icon name="calendar-outline"></ion-icon>
                <ion-label>&nbsp;{{ item.descrizione }}</ion-label>
              </ion-col>
              <ion-col size="3" class="ion-hide-sm-down">
                <ion-label>{{ quando(item) }}</ion-label>
              </ion-col>
              <ion-col size="2" class="ion-hide-sm-down">
                <ion-button size="small" fill="outline" shape="round" (click)="btnDelete.event(item)" color="{{btnDelete.color}}">
                  <ion-icon name="{{btnDelete.image}}"></ion-icon>
                  &nbsp;{{btnDelete.text}}
                </ion-button>
              </ion-col>
              <ion-col size="2" class="ion-hide-sm-down">
                <ion-button size="small" fill="outline" shape="round" (click)="btnEdit.event(item)" color="{{btnEdit.color}}">
                  <ion-icon name="{{btnEdit.image}}"></ion-icon>
                  &nbsp;{{btnEdit.text}}
                </ion-button>
              </ion-col>
            </ion-row>
          }
        </ion-grid>
      }

    </ion-card-content>
  </ion-card>

</ion-content>
