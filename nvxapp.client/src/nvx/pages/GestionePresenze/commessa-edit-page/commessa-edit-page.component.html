<app-page-toolbar [title]="Title"
                  [showFilter]="ShowFilter"
                  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">
  <br />
  <form [formGroup]="_editForm">
    <ion-item>
      <ion-label position="floating">Descrizione</ion-label>
      <ion-input type="text" formControlName="descrizione"></ion-input>
    </ion-item>
    <ion-note color="danger" *ngIf="_editForm.get('descrizione')?.hasError('required') && _editForm.get('descrizione')?.touched">
      Descrizione è obbligatorio.
    </ion-note>
    <ion-note color="danger" *ngIf="_editForm.get('descrizione')?.hasError('maxlength') && _editForm.get('descrizione')?.touched">
      Descrizione non può superare i 50 caratteri.
    </ion-note>

    <!-- Combo per selezione cliente -->
    <ion-item>
      <ion-label position="floating">Cliente</ion-label>
      <ion-select formControlName="idAz_Cliente" placeholder="Seleziona cliente">
        <ion-select-option *ngFor="let cliente of _az_ClienteModelList" [value]="cliente.id">
          {{ cliente.descrizione }}
        </ion-select-option>
      </ion-select>
    </ion-item>
    <ion-note color="danger" *ngIf="_editForm.get('idAz_Cliente')?.hasError('required') && _editForm.get('idAz_Cliente')?.touched">
      Cliente è obbligatorio.
    </ion-note>

    <!-- Campo Data -->
    <ion-item>
      <ion-label position="stacked" style="margin-bottom:13px;">Data inizio</ion-label>
      <ion-datetime-button  datetime="startDatetime"></ion-datetime-button>
    </ion-item>

    <!-- Campo DataA -->
    <ion-item>
      <ion-label position="stacked" style="margin-bottom:13px;">Data fine</ion-label>
      <ion-datetime-button datetime="endDatetime"></ion-datetime-button>
    </ion-item>

  </form>
  <br />

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="startDatetime"
                    [(ngModel)]="startDate"
                    presentation="date"
                    [showDefaultButtons]="true"
                    doneText="Fatto"
                    cancelText="Annulla"
                    (ionChange)="updateStartDate($event)"
                    locale="it-IT">
      </ion-datetime>
    </ng-template>
  </ion-modal>

  <ion-modal [keepContentsMounted]="true">
    <ng-template>
      <ion-datetime id="endDatetime"
                    [(ngModel)]="endDate"
                    presentation="date"
                    [showDefaultButtons]="true"
                    doneText="Fatto"
                    cancelText="Annulla"
                    (ionChange)="updateEndDate($event)"
                    locale="it-IT">
      </ion-datetime>
    </ng-template>
  </ion-modal>



</ion-content>
<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
