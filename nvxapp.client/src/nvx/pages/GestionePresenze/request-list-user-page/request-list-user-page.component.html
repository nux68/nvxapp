<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>



      <nvx-list
        [items]="dip_GG_RichiestaList"
        [columns]="columns"
        [actions]="actions"
        [searchText]="searchText">
        <!-- mobile: date, tipo, dettaglio e stato -->
        <ng-template nvxMobile let-item>
          <ion-label>
            <h2>{{ item.data }}@if (getDataA(item)) { &ndash; {{ getDataA(item) }} }</h2>
            <p>{{ item.richiestaTipo | tipoRichiestaToShortText }} {{ getDati(item) }}</p>
          </ion-label>
          <ion-note slot="end">{{ timeSheetService.get_StatoRichiesta_Approval_text(item) }}</ion-note>
        </ng-template>
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
