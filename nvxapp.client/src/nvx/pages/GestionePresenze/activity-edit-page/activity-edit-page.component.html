<app-page-toolbar [title]="Title"
                  [showFilter]="ShowFilter"
                  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>

      <!--<ion-item class="nvx-item-4-title">
        <ion-label>Info </ion-label>
      </ion-item>-->

      <form [formGroup]="_editForm">

        <ion-segment (ionChange)="segmentChanged($event)" [value]="currSection">
          <ion-segment-button value="sez1" content-id="sez1">
            <ion-label>Generale</ion-label>
          </ion-segment-button>
          <ion-segment-button value="sez2" content-id="sez2">
            <ion-label>Competenze</ion-label>
          </ion-segment-button>
        </ion-segment>

        <div [hidden]="currSection!='sez1'">
          <br />
          <div formGroupName="par_Attivita">

            <ion-item class="nvx-item-4-title">
              <ion-label>Info attività</ion-label>
            </ion-item>

            <ion-item>
              <ion-label position="floating">Descrizione</ion-label>
              <ion-input formControlName="descrizione"></ion-input>
            </ion-item>
            <ion-note *ngIf="_editForm.get('descrizione')?.invalid && _editForm.get('descrizione')?.touched">
              <ion-text color="danger">La descrizione è obbligatoria (max 50 caratteri).</ion-text>
            </ion-note>

            <ion-item>
              <ion-label>Colore sfondo</ion-label>
              <input type="color" formControlName="backgroundColor">
            </ion-item>
            <ion-item>
              <ion-label>Colore testto</ion-label>
              <input type="color" formControlName="textColor">
            </ion-item>

          </div>
        </div>

        <div [hidden]="currSection!='sez2'">
          <br />

          <ion-item class="nvx-item-4-title">
            <ion-label>Competenze necessarie per sfolgere l' attività {{getAttivitaDescr()}}</ion-label>
            
          </ion-item>

          <ion-item-sliding *ngFor="let item of getPar_Competenza() | genericFilter: 'descrizione' : searchText" class="ion-hide-sm-up">
            <ion-item>
              <ion-checkbox slot="start" [checked]="isSelectedaz_Par_AttivitaCompetenza(item.id)" (ionChange)="toggleSelectionaz_Par_AttivitaCompetenza(item.id, $event)"></ion-checkbox>
              <ion-label>
                {{ item.id | parCompetenzaToLongText }}
              </ion-label>
            </ion-item>
          </ion-item-sliding>

          <ion-grid class="ion-hide-sm-down">
            <ion-row>
              <ion-col size="1">Abil</ion-col>
              <ion-col>Descr</ion-col>

            </ion-row>
            <ion-row *ngFor="let item of getPar_Competenza() | genericFilter: 'descrizione' : searchText" class="nvx-ion-row-4table">
              <ion-col size="1">
                <ion-checkbox [checked]="isSelectedaz_Par_AttivitaCompetenza(item.id)" (ionChange)="toggleSelectionaz_Par_AttivitaCompetenza(item.id, $event)"></ion-checkbox>
              </ion-col>
              <ion-col>
                <ion-label>
                  {{ item.id | parCompetenzaToLongText }}
                </ion-label>
              </ion-col>
            </ion-row>
          </ion-grid>

        </div>


      

      </form>
      <br />
    </ion-card-content>
  </ion-card>

</ion-content>
<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
