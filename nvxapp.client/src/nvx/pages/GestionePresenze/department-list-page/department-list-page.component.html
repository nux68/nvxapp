<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>

      <app-sedi-reparto-user-navigation [showPeriodSelect]="false"
        [showSediSelect]="true"
        [showRepartoSelect]="false"
        [showUserSelect]="false"
        (periodChange)="onPeriodChange($event)"
        (sediIdChange)="onSedeChanged($event)"
        (repartoIdChange)="onRepartiChanged($event)"
        (allUsersIdChange)="onAllUsersInSelectionChanged($event)"
        (currUserIdChange)="onCurrentUserChanged($event)">
      </app-sedi-reparto-user-navigation>

      <nvx-list
        [items]="az_SediRepartoList"
        [columns]="columns"
        [actions]="actions"
        icon="server-outline"
        [searchText]="searchText"
        [sort]="sortList">
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
