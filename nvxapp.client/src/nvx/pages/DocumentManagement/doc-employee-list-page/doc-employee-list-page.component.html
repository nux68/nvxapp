<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      @if (!abilitato) {
        <ion-note color="warning">{{ 'documents.pages.employeeList.notEnabled' | transloco }}</ion-note>
      } @else {
        <ion-note class="nvx-nota-disabled">{{ 'documents.pages.employeeList.note' | transloco }}</ion-note>
      }
      <nvx-list
        [items]="items"
        [columns]="columns"
        [actions]="actions"
        trackKey="id"
        icon="people-outline"
        [searchText]="searchText"
        [rowDisabled]="isDisabled"
        [disabledToggleLabel]="'documents.pages.list.showDisabled' | transloco">
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
