<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      @if (!abilitato) {
        <ion-note color="warning">{{ 'documents.pages.employeeList.notEnabled' | transloco }}</ion-note>
      }
      @if (caricaPersonale) {
        <ion-button size="small" fill="outline" shape="round" (click)="invioMultiplo()">
          <ion-icon slot="start" name="send-outline"></ion-icon>{{ 'documents.multiSend.fab' | transloco }}
        </ion-button>
      }
      <!-- opzioni della lista: Mostra disabilitati e la spiegazione delle icone -->
      <nvx-list-options
        [showDisabledLabel]="'documents.pages.employeeList.showDisabled' | transloco"
        [(showDisabled)]="showDisabled"
        [note]="'documents.pages.employeeList.note' | transloco">
      </nvx-list-options>
      <nvx-list
        [items]="items"
        [columns]="columns"
        [actions]="actions"
        trackKey="id"
        [icon]="iconOf"
        [highlight]="haAccount"
        [searchText]="searchText"
        [rowDisabled]="isDisabled"
        [disabledToggleExternal]="true"
        [(showDisabled)]="showDisabled">
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
