<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <nvx-list
        [items]="documenti"
        [columns]="columns"
        [actions]="actions"
        trackKey="id"
        icon="folder-open-outline"
        [searchText]="searchText"
        [sort]="sort">
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
