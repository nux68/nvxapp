<app-page-toolbar [title]="title" [showFilter]="true" [showBreadcrumbs]="true" (ev_Filter)="Filter($event)"></app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <nvx-list-options [showDisabledLabel]="'ast.pages.vehicleList.showDisposed' | transloco" [(showDisabled)]="showDisabled"></nvx-list-options>
      <nvx-list [items]="items" [columns]="columns" [actions]="actions" icon="car-outline" [searchText]="searchText" [sort]="sort"
        [rowDisabled]="isDisabled" [disabledToggleExternal]="true" [(showDisabled)]="showDisabled"
        [emptyText]="'ast.pages.vehicleList.empty' | transloco"></nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
