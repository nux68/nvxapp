<app-page-toolbar [title]="title" [showFilter]="true" [showBreadcrumbs]="true" (ev_Filter)="Filter($event)"></app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <nvx-list-options [showDisabledLabel]="'ast.pages.resourceList.showInactive' | transloco" [(showDisabled)]="showDisabled"></nvx-list-options>
      <nvx-list [items]="dati?.risorsa" [columns]="columns" [actions]="actions" [icon]="iconOf" [searchText]="searchText"
        [rowDisabled]="disattiva" [disabledToggleExternal]="true" [(showDisabled)]="showDisabled"
        [emptyText]="'ast.pages.resourceList.empty' | transloco"></nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
