<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>

      <ion-segment [value]="filtro" (ionChange)="filtroChanged($event.detail.value)" [scrollable]="true">
        @for (f of filtri; track f) {
          <ion-segment-button [value]="f">
            <ion-label>{{ ('pages.notificationList.filter.' + f) | transloco }}</ion-label>
          </ion-segment-button>
        }
      </ion-segment>

      <!-- mobile: le azioni sull'elenco qui sopra (in fondo non ci starebbero tutte) -->
      @if (mobile) {
        <div class="nvx-notification-actions">
          @for (b of azioniElenco; track b) {
            <ion-button size="small" shape="round" fill="clear" [color]="b.color" (click)="b.event({})">
              <ion-icon slot="start" [name]="b.image"></ion-icon>
              {{ b.text }}
            </ion-button>
          }
        </div>
      }

      <nvx-list
        [items]="notificationList"
        [columns]="columns"
        [actions]="actions"
        trackKey="id"
        [icon]="iconOf"
        [highlight]="highlight"
        [searchText]="searchText"
        [sort]="sortByData"
        [mobileTap]="dettaglio"
        [emptyText]="'pages.notificationList.empty' | transloco">

        <!-- mobile: titolo su una riga, inizio del messaggio e data breve; il testo intero nel popup (tocco) -->
        <ng-template nvxMobile let-item>
          <ion-icon slot="start" class="nvx-notification-icon" [class.non-letta]="!item.letta" [name]="iconOf(item)" aria-hidden="true"></ion-icon>
          <div class="nvx-notification" [class.non-letta]="!item.letta">
            <div class="testata">
              <span class="titolo">{{ item.titolo }}</span>
              <span class="data">{{ dataBreve(item) }}</span>
            </div>
            @if (item.messaggio) {
              <div class="messaggio">{{ item.messaggio }}</div>
            }
          </div>
        </ng-template>
      </nvx-list>

      @if (altreDisponibili) {
        <div class="nvx-notification-more">
          <ion-button size="small" shape="round" [fill]="btnCaricaAltri.fill" [color]="btnCaricaAltri.color" (click)="btnCaricaAltri.event({})">
            <ion-icon slot="start" [name]="btnCaricaAltri.image"></ion-icon>
            {{ btnCaricaAltri.text }}
          </ion-button>
        </div>
      }

    </ion-card-content>
  </ion-card>

</ion-content>

<app-page-buttonbar [buttonbar]="mobile ? buttonbarMobile : buttonbar"></app-page-buttonbar>
