<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>

      <ion-segment [value]="filtro" (ionChange)="filtroChanged($event.detail.value)" [scrollable]="true">
        @for (f of filtri; track f) {
          <ion-segment-button [value]="f">
            <ion-label>{{ ('pages.notificationList.filter.' + f) | transloco }}</ion-label>
          </ion-segment-button>
        }
      </ion-segment>

      <nvx-list
        [items]="notificationList"
        [columns]="columns"
        [actions]="actions"
        trackKey="id"
        [icon]="iconOf"
        [highlight]="highlight"
        [searchText]="searchText"
        [sort]="sortByData"
        [emptyText]="'pages.notificationList.empty' | transloco">
      </nvx-list>

      @if (altreDisponibili) {
        <div class="nvx-notification-more">
          <ion-button size="small" shape="round" [fill]="btnCaricaAltri.fill" [color]="btnCaricaAltri.color" (click)="btnCaricaAltri.event({})">
            <ion-icon slot="start" [name]="btnCaricaAltri.image"></ion-icon>
            {{ btnCaricaAltri.text }}
          </ion-button>
        </div>
      }

    </ion-card-content>
  </ion-card>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
