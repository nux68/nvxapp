<app-page-toolbar [title]="title | transloco"
                  [showFilter]="false"
                  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>
      <ion-item class="nvx-item-4-title">
        <ion-label>{{ 'widgets.config.title' | transloco }}</ion-label>
      </ion-item>
      <ion-note class="nvx-dashboard-config-note">{{ 'widgets.config.note' | transloco }}</ion-note>

      <app-widget-config></app-widget-config>
    </ion-card-content>
  </ion-card>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
