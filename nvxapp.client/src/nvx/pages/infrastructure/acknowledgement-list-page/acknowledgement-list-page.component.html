<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>

      <ion-segment [value]="filtro" (ionChange)="filtroChanged($event.detail.value)" [scrollable]="true">
        @for (f of filtri; track f) {
          <ion-segment-button [value]="f">
            <ion-label>{{ ('pages.acknowledgementList.filter.' + f) | transloco }}</ion-label>
          </ion-segment-button>
        }
      </ion-segment>

      <ion-note class="nvx-acknowledgement-note">{{ 'pages.acknowledgementList.note' | transloco }}</ion-note>

      <nvx-list
        [items]="acknowledgementList"
        [columns]="columns"
        [actions]="actions"
        trackKey="id"
        [icon]="iconOf"
        [highlight]="highlight"
        [searchText]="searchText"
        [sort]="sortByData"
        [emptyText]="'pages.acknowledgementList.empty' | transloco"
        [mobileTap]="dettaglio">
        <!-- mobile: titolo e data su una riga, inizio del testo e stato; il testo intero nel popup (tocco) -->
        <ng-template nvxMobile let-item>
          <ion-icon slot="start" class="nvx-pv-icon" [class.da-confermare]="!item.dataConferma" [name]="iconOf(item)" aria-hidden="true"></ion-icon>
          <div class="nvx-pv" [class.da-confermare]="!item.dataConferma">
            <div class="testata">
              <span class="titolo">{{ item.titolo }}</span>
              <span class="data">{{ dataBreve(item) }}</span>
            </div>
            @if (item.testo) {
              <div class="testo">{{ item.testo }}</div>
            }
            <div class="stato">{{ descrizioneStato(item) }}</div>
          </div>
        </ng-template>
      </nvx-list>

    </ion-card-content>
  </ion-card>

</ion-content>
