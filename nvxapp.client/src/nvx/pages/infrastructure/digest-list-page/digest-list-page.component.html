<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>

      <ion-note class="nvx-digest-note">{{ 'pages.digestList.note' | transloco }}</ion-note>

      @if (generando) {
        <div class="nvx-digest-generating">
          <ion-spinner name="dots"></ion-spinner>
          <ion-label>{{ 'pages.digestList.generating' | transloco }}</ion-label>
        </div>
      }

      <nvx-list
        [items]="digestList"
        [columns]="columns"
        [actions]="actions"
        trackKey="id"
        [icon]="iconOf"
        [searchText]="searchText"
        [sort]="sortByData"
        [emptyText]="'pages.digestList.empty' | transloco">
      </nvx-list>

    </ion-card-content>
  </ion-card>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
