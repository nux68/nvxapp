<app-page-toolbar [title]="Title"
  [showFilter]="ShowFilter"
  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>

      <ion-item class="nvx-item-4-title">
        <ion-label>{{ _editModel?.azienda }} – {{ _editModel?.studio }}</ion-label>
      </ion-item>
      <p class="nvx-nota-disabled">{{ Used }}</p>
      <p class="nvx-nota-disabled">{{ 'pages.companyStorageEdit.quota' | transloco: { plan: _editModel?.pacchetto } }}</p>

      <form [formGroup]="_editForm">
        <ion-item>
          <ion-input type="number" formControlName="warningPercentAzienda" [label]="'pages.companyStorageEdit.warning' | transloco" labelPlacement="floating"></ion-input>
        </ion-item>
        <ion-note class="nvx-nota-disabled">{{ 'pages.companyStorageEdit.note' | transloco: { warning: _editModel?.warningPercent } }}</ion-note>
      </form>

      <br />

    </ion-card-content>
  </ion-card>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
