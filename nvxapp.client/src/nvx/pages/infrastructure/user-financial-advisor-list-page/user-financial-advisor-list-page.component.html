<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>
      <nvx-list
        [items]="userFinancialAdvisorList"
        [columns]="columns"
        [actions]="actions"
        trackKey="idUserFinancialAdvisor"
        [icon]="iconOf"
        [highlight]="isHighlighted"
        [searchText]="searchText"
        [sort]="sortByRole"
        [rowDisabled]="isDisabled"
        [disabledToggleLabel]="'pages.userFinancialAdvisorList.showDisabled' | transloco">
      </nvx-list>
    </ion-card-content>
  </ion-card>

</ion-content>
