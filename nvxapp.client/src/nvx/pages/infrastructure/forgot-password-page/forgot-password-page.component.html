<app-page-toolbar [title]="title"
  [showFilter]="false"
  [showBreadcrumbs]="false">
</app-page-toolbar>

<ion-content [fullscreen]="true">
  <div class="nvx-sc">

    <section class="nvx-sc-hero">
      <h1 class="nvx-sc-title">{{ c.titolo }}</h1>
      <p class="nvx-sc-sub">{{ c.sottotitolo }}</p>
    </section>

    <section class="nvx-sc-form-wrap nvx-sc-text">
      @if (inviata) {
        <!-- richiesta inviata: stessa risposta che l'utente esista o no -->
        <div class="nvx-sc-form">
          <div class="ion-padding">
            <div class="nvx-sc-card-icon"><ion-icon name="mail-unread-outline"></ion-icon></div>
            <h2>Controlla la posta</h2>
            <p>{{ c.inviata }}</p>
            <p class="nvx-sc-muted">Il link vale {{ scadenzaOre }} ore e si usa una volta sola; se non trovi l’email guarda anche nella posta indesiderata.</p>
          </div>
        </div>
      } @else {
        <form class="nvx-sc-form" [formGroup]="form" (ngSubmit)="form.valid && buttonbar[0].event(null)">
          <ion-item lines="full">
            <ion-input label="Nome utente" labelPlacement="floating" formControlName="userName" autocomplete="username"></ion-input>
          </ion-item>
          @if (errori.length > 0) {
            <div class="nvx-sc-error">
              @for (e of errori; track e) {
                <p>{{ e }}</p>
              }
            </div>
          }
        </form>
      }
    </section>

  </div>
  <app-showcase-footer></app-showcase-footer>
</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
