<app-page-toolbar [title]="title"
  [showFilter]="false"
  [showBreadcrumbs]="false">
</app-page-toolbar>

<ion-content [fullscreen]="true">
  <div class="login-content-center">
    <ion-card>
      <ion-card-content>
        <!-- intestazione: nome dell'applicazione -->
        <div class="nvx-login-brand">
          <div class="nvx-login-icon"><ion-icon name="calendar-clear-outline"></ion-icon></div>
          <h1>{{ siteName }}</h1>
          <p>Accedi con il tuo account</p>
        </div>
        <form [formGroup]="loginForm">
          <ion-item>
            <ion-label position="floating">User Name</ion-label>
            <ion-input type="email" formControlName="email"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="floating">Password</ion-label>
            <ion-input type="password" formControlName="password"></ion-input>
          </ion-item>
          @if (loginError) {
            <div class="error-container">
              <p class="error-text">{{ loginError }}</p>
            </div>
          }
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
