<app-page-toolbar [title]="Title"
  [showFilter]="false"
  [showBreadcrumbs]="false">
</app-page-toolbar>

<ion-content [fullscreen]="true">
  <div class="login-content-center">
    <ion-card>
      <ion-card-content>
        <!-- intestazione: nome dell'applicazione -->
        <div class="nvx-login-brand">
          <div class="nvx-login-icon"><ion-icon name="calendar-clear-outline"></ion-icon></div>
          <h1>{{ siteName }}</h1>
          <p>{{ 'pages.login.subtitle' | transloco }}</p>
        </div>
        <form [formGroup]="_editForm">
          <ion-item>
            <ion-label position="floating">{{ 'pages.login.userName' | transloco }}</ion-label>
            <ion-input type="email" formControlName="userName"></ion-input>
          </ion-item>
          <ion-item>
            <ion-label position="floating">{{ 'pages.login.password' | transloco }}</ion-label>
            <ion-input type="password" formControlName="password"></ion-input>
          </ion-item>
          @if (loginError) {
            <div class="error-container">
              <p class="error-text">{{ loginError }}</p>
            </div>
          }
        </form>
        <!-- recupero dell'accesso e cambio della password (pagine dello showcase) -->
        <div class="nvx-login-forgot">
          <a (click)="passwordDimenticata()">{{ 'pages.login.forgotPassword' | transloco }}</a>
          <span class="nvx-login-sep">|</span>
          <a (click)="cambiaPassword()">{{ 'pages.login.changePassword' | transloco }}</a>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
