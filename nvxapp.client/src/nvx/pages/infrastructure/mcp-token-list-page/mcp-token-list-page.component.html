<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>

      <ion-note class="nvx-mcp-note">{{ 'pages.mcpTokenList.note' | transloco }}</ion-note>

      @if (avviso; as a) {
        <ion-note class="nvx-mcp-note" [color]="a.color">{{ a.key | transloco }}</ion-note>
      }

      <ion-segment [value]="filtro" (ionChange)="filtroChanged($event.detail.value)" [scrollable]="true">
        @for (f of filtri; track f) {
          <ion-segment-button [value]="f">
            <ion-label>{{ ('pages.mcpTokenList.filter.' + f) | transloco }}</ion-label>
          </ion-segment-button>
        }
      </ion-segment>

      <nvx-list
        [items]="tokenList"
        [columns]="columns"
        [actions]="actions"
        trackKey="id"
        [icon]="iconOf"
        [highlight]="highlight"
        [searchText]="searchText"
        [sort]="sortByCreazione"
        [emptyText]="'pages.mcpTokenList.empty' | transloco">
      </nvx-list>

    </ion-card-content>
  </ion-card>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
