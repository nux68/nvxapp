<app-page-toolbar [title]="title" [showFilter]="false" [showBreadcrumbs]="true"></app-page-toolbar>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-card-content>
      <ion-item lines="none">
        <ion-icon slot="start" name="book-outline" color="primary"></ion-icon>
        <ion-label class="ion-text-wrap">
          <h2>{{ title }}</h2>
          <p>{{ description }}</p>
        </ion-label>
      </ion-item>
      <ion-note class="nvx-nota-disabled">{{ avviato ? ('pages.userManual.started' | transloco) : note }}</ion-note>
      <br />
      <ion-button shape="round" [disabled]="inPreparazione" (click)="scarica()">
        <ion-icon slot="start" name="download-outline"></ion-icon>
        {{ 'pages.userManual.download' | transloco }}
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
