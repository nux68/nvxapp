<app-page-toolbar [title]="title"

                  [showBreadcrumbs]="false">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <div class="login-content-center">
    <ion-card>
      <ion-card-content>

        <div class="nvx-logout-brand">
          <div class="nvx-logout-icon"><ion-icon name="log-out-outline"></ion-icon></div>

        </div>


        <form [formGroup]="logoutForm">
        </form>
      </ion-card-content>
    </ion-card>
  </div>

</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
