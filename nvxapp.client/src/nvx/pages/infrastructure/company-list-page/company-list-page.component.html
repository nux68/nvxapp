<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>
      <!-- opzioni della lista (Mostra disabilitati, Abilita cancellazioni) -->
      <nvx-list-options
        [showDisabledLabel]="'pages.companyList.showDisabled' | transloco"
        [(showDisabled)]="showDisabled"
        [deleteAvailable]="canDelete"
        [(deleteEnabled)]="deleteEnabled">
      </nvx-list-options>
      <nvx-list
        [items]="companyList"
        [columns]="columns"
        [actions]="actions"
        trackKey="idCompany"
        icon="server-outline"
        [searchText]="searchText"
        [sort]="sortByDescrizione"
        [rowDisabled]="isDisabled"
        [disabledToggleExternal]="true"
        [(showDisabled)]="showDisabled">
      </nvx-list>
    </ion-card-content>
  </ion-card>

</ion-content>
