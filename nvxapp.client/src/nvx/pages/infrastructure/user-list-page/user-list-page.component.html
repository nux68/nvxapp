<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>
      <nvx-list
        [items]="userList"
        [columns]="columns"
        [actions]="actions"
        trackKey="idAspNetUsers"
        [icon]="iconOf"
        [highlight]="isHighlighted"
        [searchText]="searchText"
        [sort]="sortByRole">
      </nvx-list>
    </ion-card-content>
  </ion-card>

</ion-content>
