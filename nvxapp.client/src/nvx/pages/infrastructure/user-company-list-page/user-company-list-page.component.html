<app-page-toolbar [title]="title"
                  [showFilter]="true"
                  [showBreadcrumbs]="true"
                  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>



      <ion-grid *ngIf="userCompanyList!=null">
        <ion-row *ngFor="let item of getAll() | genericFilter: 'descrizione' : searchText; let indexRow4Color = index"
                 [class.nvx-row-odd]="indexRow4Color % 2 !== 0"
                 [class.nvx-row-even]="indexRow4Color % 2 === 0"
                 class="nvx-ion-row-4table nvx-row-hover">

          <ion-item-sliding class="ion-hide-sm-up">

            <ion-item lines="none">
              <ion-grid>
                <ion-row class="ion-align-items-center">

                  <!-- ICONA -->
                  <ion-col size="2">
                    <ion-icon [name]="isAdmin(item) ? 'person-add-outline' : 'person-outline'">
                    </ion-icon>
                  </ion-col>

                  <!-- DESCRIZIONE -->
                  <ion-col size="10">
                    <ion-label [ngStyle]="{ color: isAdmin(item) ? 'var(--ion-color-primary)' : '' }">
                      {{ item.descrizione }}
                    </ion-label>
                  </ion-col>

                </ion-row>
              </ion-grid>
            </ion-item>

            <!-- OPTIONS -->
            <ion-item-options side="end">

              <ion-item-option color="{{btnImpersona.color}}"
                               (click)="btnImpersona.event(item)"
                               *ngIf="isUser(item)">
                <ion-icon slot="start" name="{{btnImpersona.image}}"></ion-icon>
                Impersona
              </ion-item-option>

              <ion-item-option color="{{btnEdit.color}}"
                               (click)="btnEdit.event(item)">
                <ion-icon slot="start" name="{{btnEdit.image}}"></ion-icon>
                Modifica
              </ion-item-option>

            </ion-item-options>

          </ion-item-sliding>





          <ion-col size="8" class="ion-hide-sm-down">
            <ion-icon [name]="isAdmin(item) ? 'person-add-outline' : 'person-outline'"></ion-icon>
            <ion-label [ngStyle]="{ color: isAdmin(item) ? 'var(--ion-color-primary)' : '' }">
              {{ item.descrizione }}
            </ion-label>
          </ion-col>
          <ion-col size="2" class="ion-hide-sm-down">
            <!--fill="solid" expand="block"-->
            <ion-button size="small" fill="outline" shape="round" (click)="btnImpersona.event(item)" color="{{btnImpersona.color}}" *ngIf="isUser(item)">
              <ion-icon name="{{btnImpersona.image}}"></ion-icon>
              &nbsp;{{btnImpersona.text}}
            </ion-button>
          </ion-col>
          <ion-col size="2" class="ion-hide-sm-down">
            <!--fill="solid" expand="block"-->
            <ion-button size="small" fill="outline" shape="round" (click)="btnEdit.event(item)" color="{{btnEdit.color}}">
              <ion-icon name="{{btnEdit.image}}"></ion-icon>
              &nbsp;{{btnEdit.text}}
            </ion-button>
          </ion-col>


        </ion-row>



      </ion-grid>

    </ion-card-content>
  </ion-card>

</ion-content>
