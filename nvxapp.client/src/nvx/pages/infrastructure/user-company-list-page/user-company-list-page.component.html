<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">

  <ion-card>
    <ion-card-content>
      <!-- utenti attivi e limite della licenza (ANALISI_INFRASTRUCTURE_LICENZE.md §5.1) -->
      @if (limiteUtenti != null && userCompanyList) {
        <p [class.nvx-nota-disabled]="utentiAttivi < limiteUtenti" [style.color]="utentiAttivi >= limiteUtenti ? 'var(--ion-color-warning-shade)' : null">
          {{ 'pages.userCompanyList.activeUsersOfLimit' | transloco: { attivi: utentiAttivi, limite: limiteUtenti } }}
        </p>
      }
      <!-- opzioni della lista (Mostra disabilitati, Abilita cancellazioni) -->
      <nvx-list-options
        [showDisabledLabel]="'pages.userCompanyList.showDisabled' | transloco"
        [(showDisabled)]="showDisabled"
        [deleteAvailable]="canDelete"
        [(deleteEnabled)]="deleteEnabled">
      </nvx-list-options>
      <nvx-list
        [items]="userCompanyList"
        [columns]="columns"
        [actions]="actions"
        trackKey="idUserCompany"
        [icon]="iconOf"
        [highlight]="isHighlighted"
        [searchText]="searchText"
        [sort]="sortByRole"
        [rowDisabled]="isDisabled"
        [disabledToggleExternal]="true"
        [(showDisabled)]="showDisabled">
      </nvx-list>
    </ion-card-content>
  </ion-card>

</ion-content>
