<app-page-toolbar [title]="title"
  [showFilter]="false"
  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <!-- accoglienza in stile "chat AI": saluto e invito a chiedere all'assistente -->
  <div class="nvx-home">
    <div class="nvx-home-icon">
      <ion-icon name="calendar-clear-outline"></ion-icon>
    </div>

    @if (userName) {
      <h1>Ciao, {{ userName }}</h1>
      <p class="nvx-home-sub">Cosa vuoi fare oggi?</p>

      <button type="button" class="nvx-ask" (click)="openChat()">
        <ion-icon name="sparkles-outline" class="nvx-ask-icon"></ion-icon>
        <span>Chiedi all'assistente…</span>
        <span class="nvx-ask-send"><ion-icon name="arrow-up"></ion-icon></span>
      </button>

      <p class="nvx-home-hint">oppure scegli una voce dal menu</p>
    } @else {
      <h1>Benvenuto in SiSignore</h1>
      <p class="nvx-home-sub">Accedi per iniziare.</p>
      <ion-button shape="round" (click)="goToLogin()">
        <ion-icon slot="start" name="log-in-outline"></ion-icon>
        Accedi
      </ion-button>
    }
  </div>

</ion-content>
