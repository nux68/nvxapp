<app-page-toolbar [title]="Title"
                  [showFilter]="ShowFilter"
                  [showBreadcrumbs]="true">
</app-page-toolbar>

<ion-content [fullscreen]="true">

  <ion-card>
    <ion-card-content>


      <br />
      <ion-item class="nvx-item-4-title">
        <ion-label>Info </ion-label>
      </ion-item>

      <form [formGroup]="_editForm">

        <ion-item>
          <ion-label position="floating">Descrizione</ion-label>
          <ion-input type="text" formControlName="descrizione" (ionChange)="UpdateDescription()" [readonly]="_editModel!=null && _editModel.idCompany > 0"></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="_editForm.get('descrizione')?.hasError('required') && _editForm.get('descrizione')?.touched">
          La descrizione è obbligatoria.
        </ion-note>
        <ion-note color="danger" *ngIf="_editForm.get('descrizione')?.hasError('maxlength') && _editForm.get('descrizione')?.touched">
          La descrizione non può superare i 20 caratteri.
        </ion-note>
        <!-- Etichetta gialla che appare solo se il valore è stato modificato -->
        <ion-note color="warning" *ngIf="modifiedDescription">
          {{ modifiedDescription }}
        </ion-note>


      </form>

      <br />

    </ion-card-content>
  </ion-card>


</ion-content>

<app-page-buttonbar [buttonbar]="buttonbar"></app-page-buttonbar>
