<app-page-toolbar [title]="title"
  [showFilter]="true"
  [showBreadcrumbs]="true"
  (ev_Filter)="Filter($event)">
</app-page-toolbar>

<ion-content [fullscreen]="true" class="nvx-wide">
  <ion-card>
    <ion-card-content>
      <nvx-list-options
        [showDisabledLabel]="'pages.customerList.showDisabled' | transloco"
        [(showDisabled)]="showDisabled">
      </nvx-list-options>
      <nvx-list
        [items]="items"
        [columns]="columns"
        [actions]="actions"
        icon="business-outline"
        [searchText]="searchText"
        [sort]="sortList"
        [rowDisabled]="isDisabled"
        [disabledToggleExternal]="true"
        [(showDisabled)]="showDisabled">
      </nvx-list>
    </ion-card-content>
  </ion-card>
</ion-content>
