# nvxapp in Docker: app + PostgreSQL + RabbitMQ (punto 9 di nvxapp.server/docs/ANALISI_DOCKER.md).
#
# File base, comune a tutti gli ambienti. Si usa sempre insieme a un override:
#   docker-compose.local.yml  PC di sviluppo: costruisce l'immagine, app su http://localhost:8080
#   docker-compose.prod.yml   VPS: Caddy davanti con HTTPS, limiti di memoria
# Quale usare lo dice COMPOSE_FILE nel file di ambiente (copia di .env.example, mai in git):
#   PC:     DockerLocale.env, da indicare a ogni comando (lo fa da solo il profilo di pubblicazione DockerLocale)
#             docker compose --env-file DockerLocale.env up -d --build
#   server: DockerVps.env copiato sul server come .env, letto in automatico
#             docker compose up -d
# Altri comandi (sul PC sempre con --env-file DockerLocale.env):
#   docker compose down         ferma tutto (i dati restano nei volumi)
#   docker compose logs -f nvxapp
#
# Postgres e RabbitMQ non pubblicano porte: li raggiunge solo l'app, sulla rete interna del compose.

name: nvxapp

x-logging: &logging
  # senza limiti i log dei container crescono fino a riempire il disco
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nvxapp:
    image: nvxapp:${NVXAPP_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      # segreti e valori per ambiente dal file di ambiente (sezione 8 di ANALISI_DOCKER.md)
      NVXAPP_ConnectionStrings__nvxappDbContext: "Server=postgres;Port=5432;Database=${POSTGRES_DB:-nvxapp};User Id=postgres;Password=${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD nel file di ambiente (sul PC DockerLocale.env con --env-file, sul server .env)};"
      NVXAPP_JwtParameter__Key: ${NVXAPP_JwtParameter__Key:?impostare NVXAPP_JwtParameter__Key nel file di ambiente (sul PC DockerLocale.env con --env-file, sul server .env), almeno 32 caratteri}
      NVXAPP_RabbitQm__Connection__HostName: rabbitmq
      NVXAPP_RabbitQm__Connection__Port: "5672"
      NVXAPP_RabbitQm__Connection__UserName: rabbit
      NVXAPP_RabbitQm__Connection__Password: ${RABBITMQ_PASSWORD:?impostare RABBITMQ_PASSWORD nel file di ambiente (sul PC DockerLocale.env con --env-file, sul server .env)}
      NVXAPP_Email__Password: ${NVXAPP_Email__Password:-}
      NVXAPP_AI__AI_groq__ApiKey: ${NVXAPP_AI__AI_groq__ApiKey:-}
      NVXAPP_AI__AI_openrouter__ApiKey: ${NVXAPP_AI__AI_openrouter__ApiKey:-}
      NVXAPP_App__PublicUrl: ${APP_PUBLIC_URL:-}
      # si decide al primo avvio su database vuoto e non si puo' piu' cambiare (Note/Migrazioni.txt)
      NVXAPP_DbParameter__MultiTenant: ${NVXAPP_DbParameter__MultiTenant:-true}
      NVXAPP_Swagger__Enabled: ${NVXAPP_Swagger__Enabled:-false}
    volumes:
      - nvxapp_logs:/app/Logs
    logging: *logging

  postgres:
    # stessa versione maggiore dello sviluppo: i dump si scambiano senza problemi
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?impostare POSTGRES_PASSWORD nel file di ambiente (sul PC DockerLocale.env con --env-file, sul server .env)}
      POSTGRES_DB: ${POSTGRES_DB:-nvxapp}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  rabbitmq:
    image: rabbitmq:3-management
    # nome fisso: RabbitMQ salva i dati sotto il nome del nodo, che dipende dall'hostname
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rabbit
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?impostare RABBITMQ_PASSWORD nel file di ambiente (sul PC DockerLocale.env con --env-file, sul server .env)}
    volumes:
      - rabbit_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
    logging: *logging

volumes:
  nvxapp_logs:
  pg_data:
  rabbit_data:
